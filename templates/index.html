<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Object Detection Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 40px;
        }
        
        .upload-section {
            background: #f7f8fc;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input[type="file"] {
            display: none;
        }
        
        .file-label {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .file-label:hover {
            transform: translateY(-2px);
        }
        
        .file-name {
            margin-left: 15px;
            color: #666;
        }
        
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input[type="text"]:focus,
        .form-group input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .params-row {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 20px;
        }
        
        .btn {
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .results-section {
            display: none;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e1e4e8;
        }
        
        .results-header h2 {
            color: #333;
        }
        
        .detection-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .image-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .image-container {
            background: #f7f8fc;
            border-radius: 15px;
            padding: 20px;
        }
        
        .image-container h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .detections-list {
            background: #f7f8fc;
            border-radius: 15px;
            padding: 20px;
        }
        
        .cropped-images {
            background: #f7f8fc;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .cropped-images h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .cropped-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .cropped-item {
            background: white;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .cropped-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        
        .cropped-label {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
        }
        
        .cropped-score {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        
        .detections-list h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .detection-item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .detection-class {
            font-weight: 600;
            color: #667eea;
        }
        
        .detection-confidence {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            display: none;
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .params-row {
                grid-template-columns: 1fr;
            }
            
            .image-comparison {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 YOLO Object Detection Demo</h1>
            <p>Upload an image to detect objects with rotated bounding boxes</p>
        </div>
        
        <div class="content">
            <div class="upload-section">
                <form id="uploadForm">
                    <div class="form-group">
                        <label>Select Image</label>
                        <label for="fileInput" class="file-label">Choose File</label>
                        <input type="file" id="fileInput" accept="image/*" required>
                        <span class="file-name" id="fileName">No file chosen</span>
                    </div>
                    
                    <div class="params-row">
                        <div class="form-group">
                            <label for="confInput">Confidence Threshold</label>
                            <input type="number" id="confInput" min="0" max="1" step="0.05" value="0.1">
                        </div>
                        
                        <div class="form-group">
                            <label for="iouInput">IoU Threshold</label>
                            <input type="number" id="iouInput" min="0" max="1" step="0.05" value="0.25">
                        </div>
                        
                        <div class="form-group">
                            <label for="modelPath">选择模型</label>
                            <select id="modelPath">
                                <!-- Options will be loaded dynamically -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="project">选择项目</label>
                            <select id="project">
                                <!-- Options will be loaded dynamically -->
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label style="display: flex; justify-content: space-between; align-items: center;">
                            <span>Select Classes to Detect</span>
                            <div>
                                <button type="button" id="selectAllBtn" class="btn" style="padding: 6px 12px; font-size: 14px; margin-right: 8px; background: #667eea; color: white;">Select All</button>
                                <button type="button" id="deselectAllBtn" class="btn" style="padding: 6px 12px; font-size: 14px; background: #764ba2; color: white;">Deselect All</button>
                            </div>
                        </label>
                        <div id="classCheckboxes" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 15px; background: #f7f8fc; border-radius: 8px; max-height: 200px; overflow-y: auto;">
                            <!-- Checkboxes will be dynamically added here -->
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">🚀 Run Detection</button>
                </form>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing image...</p>
            </div>
            
            <div class="results-section" id="results">
                <div class="results-header">
                    <h2>Detection Results</h2>
                    <span class="detection-count" id="detectionCount">0 detections</span>
                </div>
                
                <div class="image-container" style="max-width: 800px; margin: 0 auto;">
                    <h3>Detection Results</h3>
                    <img id="resultImage" src="" alt="Detection result">
                    <p style="margin-top: 10px; text-align: center;" id="detectionCountText">0 detections</p>
                </div>
                
                <div class="cropped-images" id="croppedSection" style="display: none;">
                    <h3>Cropped Detections</h3>
                    <div class="cropped-grid" id="croppedGrid"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const errorMessage = document.getElementById('errorMessage');
        const projectSelect = document.getElementById('project');
        const modelSelect = document.getElementById('modelPath');
        const classCheckboxes = document.getElementById('classCheckboxes');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        
        async function loadModels() {
            try {
                const response = await fetch('/get_models');
                const data = await response.json();
                
                if (data.success) {
                    modelSelect.innerHTML = '';
                    data.models.forEach(modelPath => {
                        const option = document.createElement('option');
                        option.value = modelPath;
                        option.textContent = modelPath;
                        modelSelect.appendChild(option);
                    });
                } else {
                    console.error('Failed to load models:', data.error);
                }
            } catch (error) {
                console.error('Error loading models:', error);
            }
        }
        
        async function loadProjects() {
            try {
                const response = await fetch('/get_projects');
                const data = await response.json();
                
                if (data.success) {
                    projectSelect.innerHTML = '';
                    data.projects.forEach(project => {
                        const option = document.createElement('option');
                        option.value = project.value;
                        option.textContent = project.name;
                        projectSelect.appendChild(option);
                    });
                    
                    // Load classes for the first project if available
                    if (data.projects.length > 0) {
                        loadClasses(data.projects[0].value);
                    }
                } else {
                    console.error('Failed to load projects:', data.error);
                }
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }
        
        async function loadClasses(projectName) {
            try {
                const response = await fetch(`/get_classes/${projectName}`);
                const data = await response.json();
                
                if (data.success) {
                    classCheckboxes.innerHTML = '';
                    data.classes.forEach(cls => {
                        const checkboxWrapper = document.createElement('label');
                        checkboxWrapper.style.display = 'flex';
                        checkboxWrapper.style.alignItems = 'center';
                        checkboxWrapper.style.cursor = 'pointer';
                        
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.value = cls;
                        checkbox.checked = true; // Default to all checked
                        checkbox.style.marginRight = '8px';
                        checkbox.className = 'class-checkbox';
                        
                        checkboxWrapper.appendChild(checkbox);
                        checkboxWrapper.appendChild(document.createTextNode(cls));
                        classCheckboxes.appendChild(checkboxWrapper);
                    });
                } else {
                    console.error('Failed to load classes:', data.error);
                }
            } catch (error) {
                console.error('Error loading classes:', error);
            }
        }
        
        // Load models, projects and classes on page load
        loadModels();
        loadProjects();
        
        // Update classes when project changes
        projectSelect.addEventListener('change', (e) => {
            loadClasses(e.target.value);
        });
        
        // Select All button
        selectAllBtn.addEventListener('click', () => {
            document.querySelectorAll('.class-checkbox').forEach(checkbox => {
                checkbox.checked = true;
            });
        });
        
        // Deselect All button
        deselectAllBtn.addEventListener('click', () => {
            document.querySelectorAll('.class-checkbox').forEach(checkbox => {
                checkbox.checked = false;
            });
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileName.textContent = file.name;
            } else {
                fileName.textContent = 'No file chosen';
            }
        });
        
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = fileInput.files[0];
            if (!file) {
                showError('Please select an image file');
                return;
            }
            
            // Get selected classes
            const selectedClasses = [];
            document.querySelectorAll('.class-checkbox:checked').forEach(checkbox => {
                selectedClasses.push(checkbox.value);
            });
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('conf', document.getElementById('confInput').value);
            formData.append('iou', document.getElementById('iouInput').value);
            formData.append('model_path', document.getElementById('modelPath').value);
            formData.append('project', document.getElementById('project').value);
            formData.append('selected_classes', selectedClasses.join(','));
            
            loading.style.display = 'block';
            results.style.display = 'none';
            errorMessage.style.display = 'none';
            
            try {
                const response = await fetch('/detect', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                displayResults(data);
            } catch (error) {
                showError('Error: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        });
        
        function displayResults(data) {
            document.getElementById('resultImage').src = data.result_image;
            document.getElementById('detectionCountText').textContent = `${data.num_detections} detection${data.num_detections !== 1 ? 's' : ''}`;
            document.getElementById('detectionCount').textContent = `${data.num_detections} detection${data.num_detections !== 1 ? 's' : ''}`;
            
            // Get detections
            const detections = data.detections;
            
            results.style.display = 'block';
            
            // Display cropped images
            const croppedGrid = document.getElementById('croppedGrid');
            const croppedSection = document.getElementById('croppedSection');
            croppedGrid.innerHTML = '';
            
            let hasCroppedImages = false;
            
            // Add cropped images from detections
            if (detections.length > 0) {
                detections.forEach((detection, idx) => {
                    if (detection.croped_base64) {
                        hasCroppedImages = true;
                        const item = document.createElement('div');
                        item.className = 'cropped-item';
                        let className = detection.cls !== undefined ? detection.cls : '';
                        let confidence = detection.score !== undefined ? detection.score : 0;
                        item.innerHTML = `
                            <img src="data:image/png;base64,${detection.croped_base64}" alt="Cropped detection">
                            <div class="cropped-label">${className}</div>
                            <div class="cropped-score">Score: ${(confidence * 100).toFixed(1)}%</div>
                        `;
                        croppedGrid.appendChild(item);
                    }
                });
            }
            
            croppedSection.style.display = hasCroppedImages ? 'block' : 'none';
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
    </script>
</body>
</html>
